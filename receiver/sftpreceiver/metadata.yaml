display_name: SFTP Receiver
type: sftp

description: This receiver periodically pulls text files from an SFTP server and emits one log record per line.

status:
  class: receiver
  stability:
    development: [logs]
  distributions: []
  codeowners:
    active: []

tests:
  config:
    endpoint: localhost:1
    username: otel
    password: otel
    ignore_host_key: true
    include: [/logs/*.log]
