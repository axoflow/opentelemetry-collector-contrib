type: object
properties:
  delete_after_read:
    description: DeleteAfterRead removes a remote file once it is fully delivered and stopped growing.
    type: boolean
  endpoint:
    description: Endpoint is the host:port of the SFTP server.
    type: string
  ignore_host_key:
    description: IgnoreHostKey disables server verification. Testing only.
    type: boolean
  include:
    description: Include lists glob patterns of remote files to read.
    type: array
    items:
      type: string
  key_file:
    description: KeyFile is the path to a private key used for authentication.
    type: string
  known_hosts:
    description: KnownHosts is the path to the known_hosts file used to verify the server.
    type: string
  max_line_length:
    description: MaxLineLength is the longest line in bytes. Longer lines are split, so a file without newlines cannot exhaust memory.
    type: integer
  password:
    description: Password authenticates the user, or decrypts KeyFile when both are set.
    $ref: go.opentelemetry.io/collector/config/configopaque.string
  poll_interval:
    description: PollInterval is the time between two pulls.
    type: string
    format: duration
  storage:
    description: StorageID is the storage extension that keeps read offsets across restarts.
    x-pointer: true
    type: string
    x-customType: go.opentelemetry.io/collector/component.ID
  username:
    type: string
